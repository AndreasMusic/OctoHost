name: Build and Release OctoHost

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macOS-Universal
          - os: windows-latest
            platform: Windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure (macOS Universal arm64 + x86_64)
        if: runner.os == 'macOS'
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Configure (Windows x64)
        if: runner.os == 'Windows'
        run: cmake -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Package macOS Universal App
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_PATH="build/OctoHost_artefacts/Release/OctoHost.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="build/OctoHost_artefacts/OctoHost.app"
          fi
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: OctoHost.app not found!"
            exit 1
          fi
          codesign --force --deep --sign - "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "OctoHost-macOS-Universal.zip"

      - name: Package Windows x64 App
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "build\OctoHost_artefacts\Release\OctoHost.exe"
          if (-not (Test-Path $exe)) {
            $exe = "build\OctoHost_artefacts\OctoHost.exe"
          }
          if (-not (Test-Path $exe)) {
            throw "Error: OctoHost.exe not found!"
          }
          $files = @($exe, "README.md")
          if (Test-Path "LICENSE") { $files += "LICENSE" }
          Compress-Archive -Path $files -DestinationPath "OctoHost-Windows-x64.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OctoHost-${{ matrix.platform }}
          path: OctoHost-*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all platform builds
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*.zip
